name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Sent by the Publish Changes button in /admin.
  repository_dispatch:
    types: [sveltia-cms-publish]

permissions:
  contents: read

# A newer run cancels the one still going for the same branch, so only the
# latest version gets deployed.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# typecheck, lint and build are the required checks for merging into main.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Enrichment only runs for the live site, never for pull requests.
      ENRICH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Optional deploy key that the main ruleset lets through, so the
          # enrichment commit below can be pushed (docs/SETUP.md section 7).
          # Without it, checkout uses the workflow's own token.
          ssh-key: ${{ secrets.ENRICH_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Tracklist, label, genres, year and cover from MusicBrainz and Cover Art
      # Archive for albums added from /add, and addedBy from who saved them.
      - name: Fill in album details
        if: env.ENRICH == 'true'
        run: node scripts/enrich.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Saves the details in git. If the push is refused, this build still
      # has them and the next one fetches them again.
      - name: Commit album details
        if: env.ENRICH == 'true'
        run: |
          git add src/content/albums src/assets/covers
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fill in album details from MusicBrainz' -m '[skip ci]'
          git push origin HEAD:main || echo "::warning::Couldn't push the album details to main. See docs/SETUP.md section 7."
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [typecheck, lint, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
